manifestVersion: 1
id: jimu.workspace.read
version: 0.1.0
kind: tool
hostApi: ">=0.1.0 <0.2.0"
entry: {type: trusted-jvm, class: io.github.lovexiaopeng.jimu.plugins.builtin.workspace.ReadPlugin}
capabilities:
  - name: read
    inputSchema: input.schema.json
    outputSchema: output.schema.json
    sideEffect: read
permissions: {filesystem: [host-task-workspace]}
secretRefs: []
dependencies: []
limits: {timeoutMs: 30000, outputBytes: 1048576}
healthCheck: {operation: workspace-readiness, timeoutMs: 2000}
errorContract: jimu-invocation-result
eventTypes: [invocation.started, invocation.completed, invocation.failed]
