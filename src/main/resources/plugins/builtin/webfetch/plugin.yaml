manifestVersion: 1
id: jimu.web.fetch
version: 0.2.0
kind: tool
hostApi: ">=0.1.0 <0.2.0"
entry:
  type: trusted-jvm
  class: io.github.lovexiaopeng.jimu.plugins.builtin.webfetch.WebFetchPlugin
capabilities:
  - name: web_fetch
    inputSchema: input.schema.json
    outputSchema: output.schema.json
    sideEffect: read
permissions:
  network: [configured-origin-only]
secretRefs: []
dependencies: []
limits: {timeoutMs: 30000, outputBytes: 1048576}
healthCheck: {operation: provider-readiness, timeoutMs: 2000}
errorContract: jimu-invocation-result
eventTypes: [invocation.started, invocation.completed, invocation.failed]
