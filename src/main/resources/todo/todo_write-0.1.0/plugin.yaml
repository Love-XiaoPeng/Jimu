{
  "manifestVersion": 1,
  "id": "jimu.todo.write",
  "version": "0.1.0",
  "kind": "tool",
  "hostApi": ">=0.1.0 <0.2.0",
  "entry": {
    "type": "trusted-jvm",
    "class": "io.github.lovexiaopeng.jimu.plugins.builtin.todo.TodoWritePlugin"
  },
  "capabilities": [
    {
      "name": "todo_write",
      "inputSchema": "input.schema.json",
      "outputSchema": "output.schema.json",
      "sideEffect": "write"
    }
  ],
  "permissions": {},
  "secretRefs": [],
  "dependencies": [],
  "limits": {
    "timeoutMs": 30000,
    "outputBytes": 16384
  },
  "healthCheck": {
    "operation": "todo-ledger-readiness",
    "timeoutMs": 2000
  },
  "errorContract": "jimu-invocation-result",
  "eventTypes": [
    "invocation.started",
    "invocation.completed",
    "invocation.failed",
    "todo.updated",
    "todo.content_deleted"
  ]
}
